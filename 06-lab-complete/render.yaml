# Render Blueprint — web service (Docker) + Redis (Key Value).
# Khi tạo Blueprint, đặt "Blueprint Path" = 06-lab-complete/render.yaml.
# AGENT_API_KEY (sync: false) nhập trên dashboard; REDIS_URL lấy từ Key Value day14-redis.
services:
  - type: web
    name: day14-agent
    runtime: docker
    dockerContext: ./06-lab-complete
    dockerfilePath: ./06-lab-complete/Dockerfile
    buildFilter:
      paths:
        - 06-lab-complete/**
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: AGENT_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString

  - type: keyvalue
    name: day14-redis
    plan: free
    region: singapore
    ipAllowList: []
