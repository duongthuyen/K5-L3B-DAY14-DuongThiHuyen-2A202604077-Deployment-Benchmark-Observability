# Railway — build bằng Dockerfile, healthcheck /health.
# Secret (AGENT_API_KEY) và REDIS_URL đặt trong Railway Variables, không ghi ở đây.
# PORT do Railway cấp, CMD trong Dockerfile đọc ${PORT:-8000}.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
